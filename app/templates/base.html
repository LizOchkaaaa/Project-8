<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Журнал сборки{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.svg') }}" type="image/svg+xml">
  <meta name="theme-color" content="#F5F7FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131E2E" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  {% block scripts %}{% endblock %}
</head>
<body>
  <a class="skip" href="#main">К содержимому</a>
  <header class="site-header">
    <a class="brand" href="/">Журнал сборки</a>
    <nav aria-label="Основная навигация">
      <a href="/" {% if request.path == '/' %}aria-current="page"{% endif %}>Заметки</a>
      <a href="/security" {% if request.path == '/security' %}aria-current="page"{% endif %}>Разбор проверок</a>
    </nav>
  </header>
  <main id="main" tabindex="-1">{% block content %}{% endblock %}</main>
  <footer>Учебный стенд безопасной сборки. Допуск выпуска проверяет CI.</footer>
</body>
</html>
