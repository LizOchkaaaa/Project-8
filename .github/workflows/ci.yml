name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Check code style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Run Ruff linter
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "latest"

      - name: Check code formatting
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "latest"
          args: "format --check"

  secret-detection:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for secrets with Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    name: SAST Bandit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          mkdir -p reports
          bandit -r . -x ./tests,./venv -ll -f json -o reports/sast.json

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sast-report
          path: reports/sast.json

  sca:
    name: SCA pip-audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit SCA scan
        run: |
          mkdir -p reports
          pip-audit -r ./requirements.txt -f json -o reports/sca.json

      - name: Upload SCA report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sca-report
          path: reports/sca.json

  tests:
    name: Tests pytest
    needs: [lint, secret-detection, sast, sca]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: 'pip'
          cache-dependency-path: '**/requirements-dev.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          APP_SECRET_KEY: "test"
        run: pytest -q

  build:
    name: Build Docker image
    needs: [ lint, secret-detection, sast, sca, tests ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: myapp:${{ github.sha }}
          outputs: type=docker,dest=/tmp/app.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: image
          path: /tmp/app.tar
          retention-days: 1

  scan-image:
    name: Binary SCA Trivy
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: image
          path: /tmp

      - name: Load Docker image and prepare folders
        run: |
          docker load -i /tmp/app.tar
          mkdir -p reports

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.76.2
        with:
          image-ref: myapp:${{ github.sha }}
          format: json
          output: reports/image.json
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-report
          path: reports/image.json

  dast:
    name: DAST OWASP ZAP
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Download image artifact
        uses: actions/download-artifact@v7
        with:
          name: image
          path: /tmp

      - name: Load Docker image
        run: docker load -i /tmp/app.tar

      - name: Start application container
        run: |
          docker run -d --name app \
            -e APP_SECRET_KEY=test \
            -p 8000:8000 \
            myapp:${{ github.sha }}

      - name: Wait for /health endpoint
        run: curl --retry 30 --retry-delay 1 --retry-connrefused \
          --fail http://localhost:8000/health

      - name: Run ZAP baseline scan
        run: |
          mkdir -p reports
          chmod 777 reports
          docker run --rm --network host \
            -v "$PWD/reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
              -t http://localhost:8000 \
              -J report.json -w report.md -r report.html

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: reports/

      - name: Stop application container
        if: always()
        run: docker stop app || true